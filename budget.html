:root{--deep:#2E4034;--sage:#8FA68E;--terra:#E07856;--cream:#F7F3EA;--kraft:#D8C7A8;--ink:#2E4034;--mut:#6E7A55;--bg:#F7F3EA;
 --card:#FFFDF8;--line:rgba(46,64,52,.12);--soft:rgba(143,166,142,.16);--blob:transparent}
html.dark{--ink:#F1EBDD;--mut:#AEB9A0;--bg:#191919;--card:#212622;--line:rgba(241,235,221,.09);--soft:rgba(169,192,166,.13);--blob:#F7F3EA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:ui-rounded,'SF Pro Rounded',Nunito,system-ui,sans-serif}
.brad{font-family:Brad,Nunito,sans-serif;font-weight:400;letter-spacing:.01em}
.eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--mut)}
.doodle{position:absolute;pointer-events:none}
.doodle i{position:absolute;inset:8%;border-radius:50%;background:var(--blob);opacity:.92}
.doodle img{position:relative;width:100%;height:100%;object-fit:contain}
</style>

<style>
body{padding:4px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:2px 4px 10px;flex-wrap:wrap}
.top h1{font-size:30px;line-height:1}
.stamp{font-size:12px;color:var(--mut)}
.c{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;overflow:hidden}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;font:700 12.5px inherit;cursor:pointer}
.tab.on{background:#8FA68E;color:#1d261f;border-color:#8FA68E}
html:not(.dark) .tab.on{background:var(--deep);color:#F7F3EA}
.head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:128px;height:128px;flex:none}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .mid b{font-family:Brad,sans-serif;font-weight:400;font-size:30px;line-height:1}
.ring .mid span{font-size:11.5px;color:var(--mut);font-weight:700}
.sum{flex:1;min-width:200px}
.sum .big{font-family:Brad,sans-serif;font-size:34px;line-height:1.05}
.sum .sub{font-size:13.5px;color:var(--mut);font-weight:600;margin-top:4px}
.sum .note{margin-top:8px;font-size:13px}
.up{color:#7FB27A}.down{color:var(--terra)}
html:not(.dark) .up{color:#4E7D4A}
.rows{margin-top:14px}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(70px,1.6fr) auto;gap:12px;align-items:center;padding:7px 2px;border-top:1px solid var(--line);font-size:13.5px}
.row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:10px;border-radius:10px;background:var(--soft);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:10px;background:var(--sage)}
.bar i.over{background:var(--terra)}
.amt{white-space:nowrap;color:var(--mut);font-size:12.5px;text-align:right}
.amt b{color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;margin-left:6px}
.p-warn{background:rgba(224,120,86,.18);color:var(--terra)}
.p-ok{background:var(--soft);color:var(--mut)}
.months{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:16px;padding-top:6px;border-top:1px solid var(--line)}
.months div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;cursor:pointer}
.months i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--sage);opacity:.5}
.months i.over{background:var(--terra);opacity:.85}
.months div.sel i{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.months span{font-size:10.5px;color:var(--mut);font-weight:700}
.legend{font-size:11.5px;color:var(--mut);margin-top:6px}
.empty{padding:22px;text-align:center;color:var(--mut);font-size:14px}
.empty .brad{font-size:28px;color:var(--ink);display:block;margin-bottom:6px}
</style>

var app=document.getElementById('app');

async function start(){var m=location.hash.replace(/^#/,'').match(/(?:^|&)e=([^&]*)/);

 app.innerHTML='<div class="c">'+dd('shears','right:16px;top:12px;width:40px;height:62px')+tabs+'<div class="head">'+ring+'<div class="sum"><div class="big">'+money(spent)+' spent</div><div class="sub">'+label+' &middot; budget '+money(budget)+'</div><div class="note">'+note+'</div>'+(view=='month'&&sel!=cur&&!(D.m[cur]&&tot(D.m[cur])>0)?'<div class="note"><span class="pill p-warn" style="margin:0">'+mlabel(cur)+' has nothing logged yet</span></div>':'')+'</div></div><div class="rows">'+rows+'</div>'+bars+'</div>';
