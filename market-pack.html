<style>
:root{--deep:#2E4034;--sage:#8FA68E;--olive:#6E7A55;--terra:#E07856;--clay:#B8503A;--cream:#F7F3EA;--kraft:#D8C7A8;--soft:rgba(143,166,142,.18);--warm:rgba(224,120,86,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent}
body{font-family:Nunito,ui-rounded,system-ui,sans-serif;color:var(--deep);display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.w{width:100%;max-width:520px;display:flex;align-items:center;gap:16px}
.w.col{flex-direction:column;text-align:center;gap:8px}
.blob{flex:none;width:88px;height:88px;display:grid;place-items:center;background:var(--soft);
  border-radius:58% 42% 55% 45% / 48% 56% 44% 52%}
.blob.warm{background:var(--warm)}
.blob img{width:70px;height:70px;object-fit:contain}
.eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);font-weight:700}
.big{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--deep);line-height:1.08}
.sub{font-size:14px;color:var(--olive);line-height:1.4}
button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:var(--terra);color:#FFF6F2}
button.ghost{background:var(--soft);color:var(--deep)}
button:hover{filter:brightness(.96)}
input{font-family:inherit;font-size:15px;color:var(--deep);background:var(--soft);border:0;border-radius:999px;padding:8px 14px;width:100%;outline:none}
input:focus{box-shadow:0 0 0 2px var(--sage)}
</style></head><body>

<style>
body{align-items:flex-start}
ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:10px 0 12px;text-align:left}
li label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
li input{appearance:none;width:18px;height:18px;flex:none;padding:0;border-radius:50%;background:var(--soft);cursor:pointer}
li input:checked{background:var(--sage);box-shadow:inset 0 0 0 4px #F7F3EA}
li input:checked+span{color:var(--olive);text-decoration:line-through}
</style>

<script>
// edit this list any time
const ITEMS=["stakes, all designs", "stickers and sheets", "magnets", "cards and envelopes", "price signs", "table cloth", "display racks", "card reader, charged", "phone charger", "cash float", "bags", "member QR sign", "tape, pens, scissors", "water and snacks"];
const KEY='sl-market-pack';
let got={};try{got=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(got))}catch(e){}};
function draw(){const ul=document.getElementById('list');ul.innerHTML='';
 ITEMS.forEach((t,i)=>{const li=document.createElement('li');
  li.innerHTML='<label><input type="checkbox"'+(got[i]?' checked':'')+'><span></span></label>';
  li.querySelector('span').textContent=t;
  li.querySelector('input').onchange=e=>{got[i]=e.target.checked;save();head();};ul.appendChild(li);});head();}
function head(){const n=ITEMS.filter((_,i)=>got[i]).length;
 document.getElementById('head').textContent=n===ITEMS.length?'all packed. go sell some sass.':n+' of '+ITEMS.length+' packed';}
document.getElementById('clear').onclick=()=>{got={};save();draw();};
draw();
</script></body></html>
