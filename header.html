<style>
:root{--deep:#2E4034;--sage:#8FA68E;--olive:#6E7A55;--terra:#E07856;--clay:#B8503A;--cream:#F7F3EA;--kraft:#D8C7A8;--soft:rgba(143,166,142,.18);--warm:rgba(224,120,86,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent}
body{font-family:Nunito,ui-rounded,system-ui,sans-serif;color:var(--deep);display:flex;align-items:flex-start;justify-content:flex-start;padding:6px 4px;overflow:hidden}
.w{width:100%;max-width:520px;display:flex;align-items:center;gap:16px}
.w.col{flex-direction:column;text-align:center;gap:8px}
.blob{flex:none;width:88px;height:88px;display:grid;place-items:center;background:var(--soft);
  border-radius:58% 42% 55% 45% / 48% 56% 44% 52%}
.blob.warm{background:var(--warm)}
.blob img{width:70px;height:70px;object-fit:contain}
.eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);font-weight:700}
.big{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--deep);line-height:1.08}
.sub{font-size:14px;color:var(--olive);line-height:1.4}
button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:var(--terra);color:#FFF6F2}
button.ghost{background:var(--soft);color:var(--deep)}
button:hover{filter:brightness(.96)}
input{font-family:inherit;font-size:15px;color:var(--deep);background:var(--soft);border:0;border-radius:999px;padding:8px 14px;width:100%;outline:none}
input:focus{box-shadow:0 0 0 2px var(--sage)}
html.dark{--deep:#F1EBDD;--olive:#B7C2A4;--sage:#A9C0A6;--terra:#EC8A68;--soft:rgba(169,192,166,.16);--warm:rgba(236,138,104,.16)}
html.dark button:not(.ghost){color:#1F1F1F}
html.dark li input:checked{box-shadow:inset 0 0 0 4px #191919 !important}
</style>

if(q==='dark'||(!q&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');})();</script>

<style>
.grid{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 18px}
.tile{display:flex;align-items:center;gap:12px;padding:6px 0}
.tile .blob{width:62px;height:62px} .tile .blob img{width:48px;height:48px}
.strip{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:var(--warm);border-radius:999px;padding:8px 18px;margin-top:2px}
.strip img{width:28px;height:28px}

const WEEK={0:['rest day','rest counts. water yourself.'],1:['admin','log last week. answer emails. plan the week.'],2:['wholesale','follow up with two shops. check Faire. pack orders.'],3:['make','print. cut. pack. draw one new thing.'],4:['make and shops','finish orders. drop off at shops.'],5:['content','film two reels. post. plan next week.'],6:['market or rest','sell some stakes or sleep in. both count.']};

const LINES=["I was fine. then you looked at me.", "water me. not too much. not too little. figure it out.", "I grew a new leaf. you're welcome.", "I'm not dramatic. I'm just dying a little.", "sun is nice. you are fine too.", "do not move me again. I just got comfy.", "I heard you talking to the cactus.", "one leaf at a time. same as you.", "I'm thirsty. and not for attention.", "if you forget me today I will remember.", "good soil. good vibes. bad attitude.", "I'm rooting for you. literally.", "you look tired. drink some water. then give me some.", "stop checking on me. I'm growing.", "I like it here. don't tell anyone.", "slow is still growing.", "I'm a plant. I have one job. so do you.", "make the thing. I'll be here.", "it's not a mess. it's a studio.", "small pot. big plans.", "I dropped a leaf. it was on purpose.", "ship it. I believe in you. mostly.", "you're doing better than the basil.", "rest counts as work. ask any seed.", "I need light. you need lunch.", "draw something weird today.", "nobody is watching. make it anyway.", "a little snark. a lot of love.", "keep going. I'm photosynthesizing for both of us.", "today is a good day to finish one thing."];

const P=[[5,'up early'],[12,'good morning'],[17,'good afternoon'],[21,'good evening'],[24,'go to bed']];
function tick(){const n=new Date(),h=n.getHours();$('part').textContent=(P.find(p=>h<p[0])||P[0])[1];
 $('t').innerHTML=(h%12||12)+':'+String(n.getMinutes()).padStart(2,'0')+'<span style="font-size:15px;color:var(--olive);margin-left:4px">'+(h<12?'am':'pm')+'</span>';
 $('d').textContent=n.toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric'}).toLowerCase();}
tick();setInterval(tick,15000);
const now=new Date(),w=WEEK[now.getDay()];
$('day').textContent='today is '+now.toLocaleDateString('en-CA',{weekday:'long'}).toLowerCase();$('focus').textContent=w[0];$('do').textContent=w[1];
const today=new Date();today.setHours(0,0,0,0);
const nx=DATES.map(([d,t])=>[new Date(d+'T00:00:00'),t]).find(([d])=>d>=today);
if(nx){const k=Math.round((nx[0]-today)/864e5);$('what').textContent=nx[1];$('n').textContent=k===0?'today':k;$('unit').textContent=k===0?'':k===1?'day to go':'days to go';}
const doy=Math.floor((now-new Date(now.getFullYear(),0,0))/864e5);$('line').textContent=LINES[doy%LINES.length];
const W={0:'clear',1:'mostly clear',2:'a bit cloudy',3:'cloudy',45:'foggy',48:'foggy',51:'drizzle',53:'drizzle',55:'drizzle',61:'rain',63:'rain',65:'heavy rain',71:'snow',73:'snow',75:'lots of snow',80:'showers',81:'showers',82:'big showers',95:'storms'};
fetch('https://api.open-meteo.com/v1/forecast?latitude=43.13&longitude=-80.75&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FToronto&forecast_days=1')
 .then(r=>r.json()).then(j=>{$('wt').textContent=Math.round(j.current.temperature_2m);
  $('ws').textContent=(W[j.current.weather_code]||'weather')+' · '+Math.round(j.daily.temperature_2m_max[0])+' / '+Math.round(j.daily.temperature_2m_min[0]);})
 .catch(()=>$('ws').textContent='the sky is not answering');
</script></body></html>
