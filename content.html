:root{--deep:#2E4034;--sage:#8FA68E;--terra:#E07856;--cream:#F7F3EA;--kraft:#D8C7A8;--ink:#2E4034;--mut:#6E7A55;--bg:#F7F3EA;
 --card:#FFFDF8;--line:rgba(46,64,52,.12);--soft:rgba(143,166,142,.16);--blob:transparent}
html.dark{--ink:#F1EBDD;--mut:#AEB9A0;--bg:#191919;--card:#212622;--line:rgba(241,235,221,.09);--soft:rgba(169,192,166,.13);--blob:#F7F3EA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:ui-rounded,'SF Pro Rounded',Nunito,system-ui,sans-serif}
.brad{font-family:Brad,Nunito,sans-serif;font-weight:400;letter-spacing:.01em}
.eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--mut)}
.doodle{position:absolute;pointer-events:none}
.doodle i{position:absolute;inset:8%;border-radius:50%;background:var(--blob);opacity:.92}
.doodle img{position:relative;width:100%;height:100%;object-fit:contain}

<style>
body{padding:4px}
.wrap{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px 16px;overflow:hidden}
h1{font-size:30px;line-height:1}
.today{margin-top:6px;font-size:13.5px;color:var(--mut);font-weight:700}
.today b{color:var(--terra)}
.lab{margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 11px;font:700 12.5px Nunito,sans-serif;cursor:pointer}
.chip.on{background:var(--deep);color:#F7F3EA;border-color:var(--deep)}
html.dark .chip.on{background:#8FA68E;color:#1d261f;border-color:#8FA68E}
.go{display:flex;gap:8px;margin-top:12px}
.btn{border:0;border-radius:14px;padding:10px 16px;font:800 14px Nunito,sans-serif;cursor:pointer;background:var(--terra);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.out{margin-top:14px;border-radius:18px;background:var(--soft);padding:14px 16px}
.hook{font-family:Brad,sans-serif;font-size:26px;line-height:1.15}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.meta span{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--card);color:var(--mut)}
.out h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
.out ol{padding-left:18px;font-size:14px;line-height:1.55}
.out p{font-size:14px;line-height:1.55}
.tagline{font-size:12.5px;color:var(--mut)}
.rhythm{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:14px}
.rhythm div{border-radius:14px;border:1px dashed var(--line);padding:9px 10px;font-size:12.5px;line-height:1.35}
.rhythm b{display:block;font-family:Brad,sans-serif;font-size:19px;font-weight:400;color:var(--terra)}
.ok{font-size:12px;color:var(--mut);margin-left:6px;align-self:center}
</style>

function copy(){var ok=document.getElementById('ok');function done(){ok.textContent='copied. paste it into a content card.'}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(last).then(done,fb)}else fb();
 function fb(){var t=document.createElement('textarea');t.value=last;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){ok.textContent='select the text above to copy'}document.body.removeChild(t)}}
function today(){var d=new Date(),w=d.getDay(),wk=Math.floor((d-new Date(d.getFullYear(),0,1))/604800000),t;
 if(d.getDate()==1)t='today is <b>drawing day</b>. one new drawing, then film it.';
 else if(w==2||w==5)t='today is a <b>post day</b>. post one thing, then close the app.';
 else if(w==3&&wk%2==0)t='today is <b>film day</b>. shoot four posts in one go.';
 else if(w==0||w==6)t='weekend. if you\u2019re at a market, film the booth. if not, rest.';
 else t='no post today. <b>15 min</b> of replies and you\u2019re done.';
 document.getElementById('today').innerHTML=t}
render();today();spin();
document.getElementById('spin').onclick=spin;document.getElementById('copy').onclick=copy;
</script>
</body></html>
