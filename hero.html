<style>
:root{--deep:#2E4034;--sage:#8FA68E;--olive:#6E7A55;--terra:#E07856;--cream:#F7F3EA;--ink:#2E4034;--bg:#F7F3EA;--soft:rgba(143,166,142,.18)}
html.dark{--ink:#F1EBDD;--bg:#191919;--olive:#B7C2A4;--soft:rgba(169,192,166,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Nunito,ui-rounded,system-ui,sans-serif;overflow:hidden}
.serif{font-family:Fraunces,Georgia,serif}
.eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--olive)}

<script>(function(){var q=new URLSearchParams(location.search).get('theme');if(q==='dark'||(!q&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');})();</script>

<style>
body{padding:4px}
.card{position:relative;display:flex;gap:22px;align-items:stretch;border-radius:22px;padding:18px 22px;min-height:222px;
 background:linear-gradient(160deg,#3A4D3F,#2E4034 60%,#26352B);color:#F4EEE2;overflow:hidden}
.wall{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:14px 14px;pointer-events:none}
.text{flex:1.1;display:flex;flex-direction:column;justify-content:center;gap:8px;z-index:1;min-width:0}
.text .eye{color:#C9D3B8}
.hi{font-size:clamp(26px,3.2vw,40px);line-height:1.05;font-weight:600}
.focus{font-size:15px;color:#E7E0D2} .focus b{color:#F5B79E;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{background:rgba(247,243,234,.1);border:1px solid rgba(247,243,234,.16);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;gap:7px;align-items:center}
.chip i{font-style:normal;font-family:Fraunces,serif;font-size:16px;color:#F5B79E}
.say{font-family:Fraunces,serif;font-size:16px;color:#F4EEE2;opacity:.95}
.say:before{content:'\201C';color:#F5B79E} .say:after{content:'\201D';color:#F5B79E}
.win{flex:1;position:relative;min-width:260px;max-width:430px;z-index:1}
.frame{position:absolute;left:8%;right:8%;top:0;bottom:44px;border-radius:120px 120px 10px 10px;border:9px solid #E9DFC9;
 box-shadow:inset 0 0 0 3px #CDBF9F, 0 6px 0 rgba(0,0,0,.18);overflow:hidden}
.sky{position:absolute;inset:0}
#fx{position:absolute;inset:0}
.mull{position:absolute;left:50%;top:0;bottom:0;width:7px;margin-left:-3.5px;background:#E9DFC9}
.mullh{position:absolute;left:0;right:0;top:55%;height:7px;background:#E9DFC9}
.orb{position:absolute;width:38px;height:38px;border-radius:50%}
.sill{position:absolute;left:2%;right:2%;bottom:30px;height:16px;border-radius:6px;background:#D9C9A6;box-shadow:0 5px 0 #B9A57E}
.pots{position:absolute;left:6%;right:6%;bottom:44px;display:flex;justify-content:space-around;align-items:flex-end}
.pots img{height:70px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.pots img.s{height:56px}
.drop{position:absolute;width:1.5px;height:14px;background:rgba(255,255,255,.55);animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-20px)}to{transform:translateY(260px)}}
.flake{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.cloud{position:absolute;height:22px;border-radius:22px;background:rgba(255,255,255,.75);animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(420px)}}
@media(max-width:640px){.card{flex-direction:column}.win{min-height:200px;max-width:none}}
