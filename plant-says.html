<title>plant says</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#2E4034;--sage:#8FA68E;--olive:#6E7A55;--terra:#E07856;--clay:#B8503A;--cream:#F7F3EA;--kraft:#D8C7A8;--soft:rgba(143,166,142,.18);--warm:rgba(224,120,86,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent}
body{font-family:Nunito,ui-rounded,system-ui,sans-serif;color:var(--deep);display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.w{width:100%;max-width:520px;display:flex;align-items:center;gap:16px}
.w.col{flex-direction:column;text-align:center;gap:8px}
.blob{flex:none;width:88px;height:88px;display:grid;place-items:center;background:var(--soft);
  border-radius:58% 42% 55% 45% / 48% 56% 44% 52%}
.blob.warm{background:var(--warm)}
.blob img{width:70px;height:70px;object-fit:contain}
.eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);font-weight:700}
.big{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--deep);line-height:1.08}
.sub{font-size:14px;color:var(--olive);line-height:1.4}
button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:var(--terra);color:#FFF6F2}
button.ghost{background:var(--soft);color:var(--deep)}
button:hover{filter:brightness(.96)}
input{font-family:inherit;font-size:15px;color:var(--deep);background:var(--soft);border:0;border-radius:999px;padding:8px 14px;width:100%;outline:none}
input:focus{box-shadow:0 0 0 2px var(--sage)}
</style></head><body>

  <div>
    <p class="eye">the plant says</p>
    <p class="big" id="l" style="font-size:22px;font-weight:500"></p>
  </div>
</div>
<script>
const L=["I was fine. then you looked at me.", "water me. not too much. not too little. figure it out.", "I grew a new leaf. you're welcome.", "I'm not dramatic. I'm just dying a little.", "sun is nice. you are fine too.", "do not move me again. I just got comfy.", "I heard you talking to the cactus.", "one leaf at a time. same as you.", "I'm thirsty. and not for attention.", "if you forget me today I will remember.", "good soil. good vibes. bad attitude.", "I'm rooting for you. literally.", "you look tired. drink some water. then give me some.", "stop checking on me. I'm growing.", "I like it here. don't tell anyone.", "slow is still growing.", "I'm a plant. I have one job. so do you.", "make the thing. I'll be here.", "it's not a mess. it's a studio.", "small pot. big plans.", "I dropped a leaf. it was on purpose.", "ship it. I believe in you. mostly.", "you're doing better than the basil.", "rest counts as work. ask any seed.", "I need light. you need lunch.", "draw something weird today.", "nobody is watching. make it anyway.", "a little snark. a lot of love.", "keep going. I'm photosynthesizing for both of us.", "today is a good day to finish one thing."];
const d=new Date(),k=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
document.getElementById('l').textContent=L[k%L.length];
</script></body></html>
