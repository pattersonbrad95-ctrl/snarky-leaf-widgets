<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>price helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#2E4034;--sage:#8FA68E;--olive:#6E7A55;--terra:#E07856;--clay:#B8503A;--cream:#F7F3EA;--kraft:#D8C7A8;--soft:rgba(143,166,142,.18);--warm:rgba(224,120,86,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent}
body{font-family:Nunito,ui-rounded,system-ui,sans-serif;color:var(--deep);display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.w{width:100%;max-width:520px;display:flex;align-items:center;gap:16px}
.w.col{flex-direction:column;text-align:center;gap:8px}
.blob{flex:none;width:88px;height:88px;display:grid;place-items:center;background:var(--soft);
  border-radius:58% 42% 55% 45% / 48% 56% 44% 52%}
.blob.warm{background:var(--warm)}
.blob img{width:70px;height:70px;object-fit:contain}
.eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);font-weight:700}
.big{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--deep);line-height:1.08}
.sub{font-size:14px;color:var(--olive);line-height:1.4}
button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:var(--terra);color:#FFF6F2}
button.ghost{background:var(--soft);color:var(--deep)}
button:hover{filter:brightness(.96)}
input{font-family:inherit;font-size:15px;color:var(--deep);background:var(--soft);border:0;border-radius:999px;padding:8px 14px;width:100%;outline:none}
input:focus{box-shadow:0 0 0 2px var(--sage)}
</style></head><body>

<style>
body{align-items:flex-start}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.row label{font-size:12px;color:var(--olive);font-weight:700;display:block;margin:0 0 4px 6px}
.out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{background:var(--soft);border-radius:22px;padding:10px 12px;text-align:center}
.pill.warm{background:var(--warm)}
.pill b{display:block;font-family:Fraunces,Georgia,serif;font-size:22px;color:var(--deep)}
.pill span{font-size:11px;color:var(--olive);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
</style>

    <div><p class="eye">price helper</p><p class="sub">what it costs you, what you charge.</p></div>
  </div>
  <div class="row">
    <div><label>it costs me</label><input id="cost" type="number" step="0.01" min="0" value="2"></div>
    <div><label>I sell it for</label><input id="price" type="number" step="0.01" min="0" value="6"></div>
  </div>
  <div class="out">
    <div class="pill"><span>you keep</span><b id="keep"></b></div>
    <div class="pill"><span>margin</span><b id="margin"></b></div>
    <div class="pill warm"><span>wholesale</span><b id="whole"></b></div>
  </div>
  <p class="sub" id="note" style="margin-top:10px;text-align:center"></p>
</div>
<script>
const $=id=>document.getElementById(id), m=n=>'$'+(Math.round(n*100)/100).toFixed(2);
function calc(){const c=+$('cost').value||0,p=+$('price').value||0,w=p/2;
 $('keep').textContent=m(p-c);
 $('margin').textContent=p?Math.round((p-c)/p*100)+'%':'--';
 $('whole').textContent=m(w);
 const ok=w>=c*2;
 $('note').textContent=!p?'':ok?'wholesale is half retail, and still 2x your cost. good.':
  'at half price for shops, this barely covers it. aim to sell for at least '+m(c*4)+'.';}
['cost','price'].forEach(i=>$(i).oninput=calc);calc();
</script></body></html>
