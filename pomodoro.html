<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#2E4034;--sage:#8FA68E;--olive:#6E7A55;--terra:#E07856;--clay:#B8503A;--cream:#F7F3EA;--kraft:#D8C7A8;--soft:#EFE8D8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--cream)}
body{font-family:Nunito,ui-rounded,system-ui,sans-serif;color:var(--deep);display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
.card{width:100%;max-width:520px;background:var(--cream);border:1.5px solid var(--kraft);border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:16px}
.card.col{flex-direction:column;text-align:center}
.art{width:84px;height:84px;flex:none;object-fit:contain}
.eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);font-weight:700}
.big{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--deep);line-height:1.05}
.sub{font-size:14px;color:var(--olive)}
button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:30px;padding:8px 16px;cursor:pointer;background:var(--terra);color:#FFF6F2}
button.ghost{background:transparent;color:var(--olive);border:1.5px solid var(--kraft)}
button:hover{filter:brightness(.95)}
</style></head><body>

const LEN={focus:25*60,break:5*60};
const LINES={focus:['water me with twenty five minutes.','growing. do not look at your phone.','halfway. I can feel a leaf coming.','almost. keep going.'],
             break:['stretch. I am.','go drink water. you too.','five minutes. then back to it.']};
let mode='focus',left=LEN.focus,timer=null,done=0;
const $=id=>document.getElementById(id);
function draw(){const tot=LEN[mode],p=1-left/tot;
 $('time').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
 $('ring').style.strokeDashoffset=339.3*(1-p);
 $('ring').style.stroke=mode==='focus'?'var(--sage)':'var(--terra)';
 $('mode').textContent=mode+(done?' · '+done+' grown today':'');
 if(mode==='focus'){$('plant').src=SPRIG;$('plant').style.transform='translateX(-50%) scale('+(0.35+0.65*p)+')';
   const l=LINES.focus;$('say').textContent=timer?l[Math.min(l.length-1,1+Math.floor(p*3))]:l[0];}}
function end(){clearInterval(timer);timer=null;$('go').textContent='start';
 if(mode==='focus'){done++;$('plant').src=DAISY;$('plant').style.transform='translateX(-50%) scale(1)';$('say').textContent='look at me. I bloomed. take a break.';mode='break';left=LEN.break;$('swap').textContent='focus';}
 else{$('say').textContent='break is over. back to it.';mode='focus';left=LEN.focus;$('swap').textContent='break';}
 draw();try{new AudioContext().resume()}catch(e){}}
$('go').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('go').textContent='start';return;}
 $('go').textContent='pause';timer=setInterval(()=>{left--;if(left<=0)return end();draw();},1000);draw();};
$('reset').onclick=()=>{clearInterval(timer);timer=null;$('go').textContent='start';left=LEN[mode];draw();};
$('swap').onclick=()=>{clearInterval(timer);timer=null;$('go').textContent='start';mode=mode==='focus'?'break':'focus';left=LEN[mode];
 $('swap').textContent=mode==='focus'?'break':'focus';$('say').textContent=LINES[mode][0];draw();};
draw();
</script>
</body></html>
