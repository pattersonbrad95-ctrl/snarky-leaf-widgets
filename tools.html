<meta name="viewport" content="width=device-width,initial-scale=1">
<title>little tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#2E4034;--sage:#8FA68E;--olive:#6E7A55;--terra:#E07856;--clay:#B8503A;--cream:#F7F3EA;--kraft:#D8C7A8;--soft:rgba(143,166,142,.18);--warm:rgba(224,120,86,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent}
body{font-family:Nunito,ui-rounded,system-ui,sans-serif;color:var(--deep);display:flex;align-items:flex-start;justify-content:flex-start;padding:6px 4px;overflow:hidden}
.w{width:100%;max-width:520px;display:flex;align-items:center;gap:16px}
.w.col{flex-direction:column;text-align:center;gap:8px}
.blob{flex:none;width:88px;height:88px;display:grid;place-items:center;background:var(--soft);
  border-radius:58% 42% 55% 45% / 48% 56% 44% 52%}
.blob.warm{background:var(--warm)}
.blob img{width:70px;height:70px;object-fit:contain}
.eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);font-weight:700}
.big{font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--deep);line-height:1.08}
.sub{font-size:14px;color:var(--olive);line-height:1.4}
button{font-family:inherit;font-weight:700;font-size:13px;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;background:var(--terra);color:#FFF6F2}
button.ghost{background:var(--soft);color:var(--deep)}
button:hover{filter:brightness(.96)}
input{font-family:inherit;font-size:15px;color:var(--deep);background:var(--soft);border:0;border-radius:999px;padding:8px 14px;width:100%;outline:none}
input:focus{box-shadow:0 0 0 2px var(--sage)}
html.dark{--deep:#F1EBDD;--olive:#B7C2A4;--sage:#A9C0A6;--terra:#EC8A68;--soft:rgba(169,192,166,.16);--warm:rgba(236,138,104,.16)}
html.dark button:not(.ghost):not([data-p]),html.dark .tabs button.on{color:#1F1F1F}
html.dark li input:checked{box-shadow:inset 0 0 0 4px #191919 !important}
</style>
<script>(function(){var q=new URLSearchParams(location.search).get('theme');
if(q==='dark'||(!q&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');})();</script>
</head><body>

<style>
.wrap{width:100%;max-width:760px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--soft);color:var(--deep)}
.tabs button.on{background:var(--terra);color:#FFF6F2}
.pane{display:none} .pane.on{display:block}
ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px;margin:10px 0 12px}
li label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
li input{appearance:none;width:18px;height:18px;flex:none;padding:0;border-radius:50%;background:var(--soft);cursor:pointer}
li input:checked{background:var(--sage);box-shadow:inset 0 0 0 4px #F7F3EA}
li input:checked+span{color:var(--olive);text-decoration:line-through}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0;max-width:420px}
.row label{font-size:12px;color:var(--olive);font-weight:700;display:block;margin:0 0 4px 6px}
.out{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px}
.pill{background:var(--soft);border-radius:22px;padding:10px 12px;text-align:center}
.pill.warm{background:var(--warm)}
.pill b{display:block;font-family:Fraunces,Georgia,serif;font-size:22px}
.pill span{font-size:11px;color:var(--olive);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.head{display:flex;align-items:center;gap:12px}
.head .blob{width:58px;height:58px} .head .blob img{width:44px;height:44px}
</style>

const SAY={focus:['water me with twenty five minutes.','growing. do not look at your phone.','halfway. I can feel a leaf coming.','almost. keep going.'],break:['stretch. I am.','go drink water. you too.','five minutes. then back to it.']};
let mode='focus',left=LEN.focus,timer=null,done=0;
function draw(){const p=1-left/LEN[mode];$('time').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
 $('ring').style.strokeDashoffset=339.3*(1-p);$('ring').style.stroke=mode==='focus'?'var(--sage)':'var(--terra)';
 $('mode').textContent=mode+(done?' · '+done+' grown today':'');
 if(mode==='focus'){$('plant').src=SPRIG;$('plant').style.transform='translateX(-50%) scale('+(0.55+0.45*p)+')';$('say').textContent=timer?SAY.focus[Math.min(3,1+Math.floor(p*3))]:SAY.focus[0];}}
function stop(){clearInterval(timer);timer=null;$('go').textContent='start';}
function end(){stop();if(mode==='focus'){done++;$('plant').src=DAISY;$('plant').style.transform='translateX(-50%) scale(1)';$('say').textContent='look at me. I bloomed. take a break.';mode='break';left=LEN.break;$('swap').textContent='focus';}
 else{$('say').textContent='break is over. back to it.';mode='focus';left=LEN.focus;$('swap').textContent='break';}draw();}
$('go').onclick=()=>{if(timer)return stop();$('go').textContent='pause';timer=setInterval(()=>{if(--left<=0)return end();draw();},1000);draw();};
$('reset').onclick=()=>{stop();left=LEN[mode];draw();};
$('swap').onclick=()=>{stop();mode=mode==='focus'?'break':'focus';left=LEN[mode];$('swap').textContent=mode==='focus'?'break':'focus';$('say').textContent=SAY[mode][0];draw();};
draw();

// ---- market bag (edit the list any time)
const ITEMS=["stakes, all designs", "stickers and sheets", "magnets", "cards and envelopes", "price signs", "table cloth", "display racks", "card reader, charged", "phone charger", "cash float", "bags", "member QR sign", "tape, pens, scissors", "water and snacks"],KEY='sl-market-pack';
let got={};try{got=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(got))}catch(e){}};
function bhead(){const n=ITEMS.filter((_,i)=>got[i]).length;$('bhead').textContent=n===ITEMS.length?'all packed. go sell some sass.':n+' of '+ITEMS.length+' packed';}
function bag(){const ul=$('list');ul.innerHTML='';ITEMS.forEach((t,i)=>{const li=document.createElement('li');
 li.innerHTML='<label><input type="checkbox"'+(got[i]?' checked':'')+'><span></span></label>';li.querySelector('span').textContent=t;
 li.querySelector('input').onchange=e=>{got[i]=e.target.checked;save();bhead();};ul.appendChild(li);});bhead();}
$('clear').onclick=()=>{got={};save();bag();};bag();

// ---- price helper
const m=n=>'$'+(Math.round(n*100)/100).toFixed(2);
function calc(){const c=+$('cost').value||0,p=+$('sell').value||0,w=p/2;$('keep').textContent=m(p-c);$('margin').textContent=p?Math.round((p-c)/p*100)+'%':'--';$('whole').textContent=m(w);
 $('note').textContent=!p?'':w>=c*2?'wholesale is half retail, and still 2x your cost. good.':'at half price for shops, this barely covers it. aim to sell for at least '+m(c*4)+'.';}
['cost','sell'].forEach(i=>$(i).oninput=calc);calc();

// ---- film this (edit the list any time)
const IDEAS=["film your hands drawing a new stake, start to finish", "show a stake in a real plant. read it out loud.", "pack an order with you. no talking. just crinkle.", "pick your top 3 stakes this week. say why.", "a day at the market in 15 seconds", "what's on my desk right now", "before and after: sketch to finished stake", "let a customer pick their favourite (ask first)", "show a mistake. what went wrong.", "which stake are you today? pick one.", "the story behind one snarky line", "restock day. show the pile.", "show the sticker sheet getting cut", "a plant 'reads' its stake. voiceover as the plant.", "answer one DM question on camera", "sneak peek of next drop. blurry on purpose.", "the rudest stake I ever drew and didn't sell", "pack a wholesale box. count it out.", "what I use: pens, paper, printer", "a slow tour of the market table", "rate plants in my house out of 10", "the one stake that always sells out", "sticker on a water bottle. real life test.", "day in the studio. five clips. that's it.", "show a card being written and sent", "plant care tip, in a plant's voice", "three stakes. match them to your friends.", "show a new drawing. ask for its name.", "how a magnet gets made", "say thank you to the mail list. show a member perk."];const d=new Date();let k=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)%IDEAS.length;
const show=()=>$('idea').textContent=IDEAS[k];$('more').onclick=()=>{k=(k+1)%IDEAS.length;show();};show();
</script></body></html>
