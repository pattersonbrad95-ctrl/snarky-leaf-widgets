:root{--deep:#2E4034;--sage:#8FA68E;--terra:#E07856;--cream:#F7F3EA;--kraft:#D8C7A8;--ink:#2E4034;--mut:#6E7A55;--bg:#F7F3EA;
 --card:#FFFDF8;--line:rgba(46,64,52,.12);--soft:rgba(143,166,142,.16);--blob:transparent}
html.dark{--ink:#F1EBDD;--mut:#AEB9A0;--bg:#191919;--card:#212622;--line:rgba(241,235,221,.09);--soft:rgba(169,192,166,.13);--blob:#F7F3EA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:ui-rounded,'SF Pro Rounded',Nunito,system-ui,sans-serif}
.brad{font-family:Brad,Nunito,sans-serif;font-weight:400;letter-spacing:.01em}
.eye{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--mut)}
.doodle{position:absolute;pointer-events:none}
.doodle i{position:absolute;inset:8%;border-radius:50%;background:var(--blob);opacity:.92}
.doodle img{position:relative;width:100%;height:100%;object-fit:contain}
</style>

<style>
body{padding:4px}
.top{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 10px}
.top h1{font-size:30px;line-height:1}
.top .stamp{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.c{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px;overflow:hidden;min-height:172px}
.c .big{font-size:44px;line-height:1;margin:10px 0 4px}
.c .sub{font-size:13px;color:var(--mut);font-weight:600}
.c .foot{margin-top:10px;font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
.c .foot b{font-weight:800}
.up{color:#7FB27A}.down{color:var(--terra)}
html:not(.dark) .up{color:#4E7D4A}
.spark{width:100%;height:38px;margin-top:6px;display:block}
.list{margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.list div{display:flex;justify-content:space-between;gap:8px}
.list span:last-child{color:var(--mut);white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800}
.p-warn{background:rgba(224,120,86,.18);color:var(--terra)}
.p-ok{background:var(--soft);color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:5px;height:34px;margin-top:8px}
.bars i{flex:1;border-radius:5px 5px 2px 2px;background:var(--sage);opacity:.55}
.bars i:last-child{background:var(--terra);opacity:1}
.goal{height:9px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:8px}
.goal i{display:block;height:100%;background:var(--sage);border-radius:9px}
.trend{margin-top:12px}
.trend h2{font-size:26px;margin:0 4px 8px}
.row{display:grid;grid-template-columns:22px minmax(0,1.6fr) minmax(60px,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);font-size:13.5px}
.row:first-of-type{border-top:0}
.row .n{font-family:Brad,sans-serif;font-size:20px;color:var(--terra);text-align:center}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.row .q{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.row .q i{display:block;height:100%;background:var(--sage);border-radius:8px}
.row .tags{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:26px;text-align:center;color:var(--mut);font-size:14px}
.empty .brad{font-size:30px;color:var(--ink);display:block;margin-bottom:6px}
</style>

function money(v){v=Math.round(+v||0);return '$'+v.toLocaleString('en-CA')}
function pct(a,b){if(!a&&b)return '<span class="sub">quiet stretch. it happens.</span>';if(!b)return a?'<span class="up">new</span>':'<span class="sub">same as last week</span>';var p=Math.round((a-b)/b*100);return p>=0?'<span class="up">\u2191 '+p+'% vs the week before</span>':'<span class="down">\u2193 '+Math.abs(p)+'% vs the week before</span>'}
function spark(a){if(!a||a.length<2)return '';var mx=Math.max.apply(null,a.concat([1])),w=200,h=38,s=w/(a.length-1);
 var pts=a.map(function(v,i){return [i*s,h-4-(v/mx)*(h-10)]});var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
 var l=pts[pts.length-1];return '<svg class="spark" viewBox="0 0 200 38" preserveAspectRatio="none"><path d="'+d+' L200 38 L0 38Z" fill="rgba(143,166,142,.18)"/><path d="'+d+'" fill="none" stroke="#8FA68E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><circle cx="'+l[0]+'" cy="'+l[1]+'" r="3.6" fill="#E07856"/></svg>'}

function lock(msg){app.innerHTML='<div class="c empty">'+dd('can','right:14px;top:10px;width:64px;height:64px')+'<span class="brad">locked</span>'+(msg||'paste your hub key once on this device to see your numbers. the key never leaves this screen.')+'<div style="margin-top:14px;display:flex;gap:8px;justify-content:center"><input id="k" type="password" autocomplete="off" placeholder="hub key" style="border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;font:600 14px inherit;width:240px"><button id="kb" style="border:0;border-radius:12px;padding:9px 14px;background:#E07856;color:#fff;font-weight:800;cursor:pointer">unlock</button></div></div>';
 document.getElementById('kb').onclick=function(){var v=document.getElementById('k').value.trim();if(!v)return;try{localStorage.setItem('sl-hub-key',v)}catch(e){}start()}}
async function start(){var m=location.hash.replace(/^#/,'').match(/(?:^|&)e=([^&]*)/);if(!m){draw(null);return}
 var k=getKey();if(!k){lock();return}
 try{var raw=b64u(m[1]),key=await crypto.subtle.importKey('raw',b64u(k),'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));draw(JSON.parse(new TextDecoder().decode(pt)))}
